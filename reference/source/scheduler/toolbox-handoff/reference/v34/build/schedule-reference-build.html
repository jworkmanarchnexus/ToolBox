<title>Schedule Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: a drawing sheet. A ruled title block on top, then a working table and a timeline underneath.
   Light theme is drafting paper; dark theme is a blueprint. Red and amber are reserved for problems. */
:root {
  --bg: #EDF0F2;
  --panel: #FFFFFF;
  --ink: #15202B;
  --muted: #566574;
  --line: #C3CCD3;
  --line2: #E1E6EA;
  --accent: #1B4F8F;
  --on-accent: #FFFFFF;
  --bar: #3B79C3;
  --bar-hold: #93B5DD;
  --wknd: #EBEEF1;
  --hol: #D8DFE5;
  --err: #B3261E;
  --err-bg: #FBEAE8;
  --warn: #8A5300;
  --warn-bg: #FFF2D9;
  --info-bg: #E4EEF9;
  --today: #D2452B;
  --sel: #E3EEFB;
  --hover: #F3F6F8;
  --p-blue: #3B79C3; --p-teal: #1F8A8A; --p-green: #4C8F3F; --p-violet: #7653B5; --p-slate: #5F7285; --p-brown: #8A5A3A; --p-amber: #C98A1B; --p-red: #B94A48; --p-rose: #B5527E; --p-olive: #7F8A2E; --p-navy: #2B4C7E; --p-sky: #3C9BD1; --p-mint: #2FA77A; --p-coral: #E0663F; --p-plum: #7A3E6E; --p-indigo: #4B4FB5; --p-sand: #B49A6B; --p-charcoal: #3A4550;
  --lv-client: var(--p-blue); --lv-design: var(--p-teal); --lv-internal: var(--p-violet);
  --f-display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1727; --panel: #11223A; --ink: #E3ECF6; --muted: #8DA2B9; --line: #2A4260; --line2: #1C3250;
    --accent: #7DB0FF; --on-accent: #0C1727; --bar: #5B9BEA; --bar-hold: #3D6BA8; --wknd: #0E1D32; --hol: #183253;
    --err: #FF8E7F; --err-bg: #3A1F24; --warn: #F2BE57; --warn-bg: #352B14; --info-bg: #16304F; --today: #FF7A5C;
    --sel: #17355A; --hover: #15294A; color-scheme: dark;
    --p-blue: #5B9BEA; --p-teal: #45B8B0; --p-green: #7BC46B; --p-violet: #A68BE0; --p-slate: #9AAEC2; --p-brown: #C79770; --p-amber: #E8B04B; --p-red: #E07A78; --p-rose: #DE8AB0; --p-olive: #B5C25A; --p-navy: #7DA2D6; --p-sky: #7CC4EE; --p-mint: #6FD3A8; --p-coral: #F09A7A; --p-plum: #B87BAB; --p-indigo: #8E92E6; --p-sand: #D9C79F; --p-charcoal: #A9B4BF; 
  }
}
:root[data-theme="dark"] {
  --bg: #0C1727; --panel: #11223A; --ink: #E3ECF6; --muted: #8DA2B9; --line: #2A4260; --line2: #1C3250;
  --accent: #7DB0FF; --on-accent: #0C1727; --bar: #5B9BEA; --bar-hold: #3D6BA8; --wknd: #0E1D32; --hol: #183253;
  --err: #FF8E7F; --err-bg: #3A1F24; --warn: #F2BE57; --warn-bg: #352B14; --info-bg: #16304F; --today: #FF7A5C;
  --sel: #17355A; --hover: #15294A; color-scheme: dark;
  --p-blue: #5B9BEA; --p-teal: #45B8B0; --p-green: #7BC46B; --p-violet: #A68BE0; --p-slate: #9AAEC2; --p-brown: #C79770; --p-amber: #E8B04B; --p-red: #E07A78; --p-rose: #DE8AB0; --p-olive: #B5C25A; --p-navy: #7DA2D6; --p-sky: #7CC4EE; --p-mint: #6FD3A8; --p-coral: #F09A7A; --p-plum: #B87BAB; --p-indigo: #8E92E6; --p-sand: #D9C79F; --p-charcoal: #A9B4BF; 
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); padding-inline: 16px; padding-block: 14px 56px; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }
.pad { padding: 20px; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: .02em; margin: 0 0 8px; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* title block */
.sheet { display: grid; grid-template-columns: minmax(280px, 2.2fr) minmax(170px, 1.2fr) minmax(130px, .8fr) minmax(150px, 1fr); border: 1.5px solid var(--ink); background: var(--panel); }
.cell { display: flex; flex-direction: column; gap: 3px; padding: 8px 12px 9px; min-width: 0; border-left: 1px solid var(--ink); }
.cell:first-child { border-left: 0; }
.lbl { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.val { font-size: 13px; min-height: 22px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.val.dirty { color: var(--warn); font-weight: 600; }
.sched-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#schedSel { flex: 1 1 230px; min-width: 0; max-width: 100%; padding: 4px 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 2px; font-weight: 600; }
.chip { display: inline-block; padding: 1px 8px; border: 1px solid var(--line); background: var(--hover); font-size: 12px; border-radius: 10px; white-space: nowrap; }
.chip.editing { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); font-weight: 600; }
.chip.away { color: var(--muted); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 2px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--line); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { border-color: var(--ink); }
.btn.danger { background: var(--err); border-color: var(--err); color: var(--panel); font-weight: 600; }
.btn.pulse { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.primary[aria-pressed="true"] { background: var(--accent); }
.ib { display: inline-grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 2px; cursor: pointer; }
.ib:hover:not(:disabled) { color: var(--ink); border-color: var(--line); background: var(--panel); }
.ib:disabled { opacity: .35; cursor: default; }
.ib.del:hover:not(:disabled) { color: var(--err); }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; }
.seg .btn + .btn { margin-left: -1px; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-block: 12px; }
.toolbar .grow { margin-left: auto; }
.toolbar label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.toolbar .grp { display: inline-flex; gap: 4px; align-items: center; }
.cnt { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 2px; border-radius: 9px; font-size: 11px; font-weight: 600; text-align: center; line-height: 17px; }
.cnt.err { background: var(--err); color: var(--panel); }
.cnt.warn { background: var(--warn); color: var(--panel); }
.cnt.ok { color: var(--muted); font-weight: 400; }
.btn[aria-pressed="true"] .cnt.ok { color: inherit; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 230px; background: var(--panel); border: 1.5px solid var(--ink); padding: 4px; display: flex; flex-direction: column; }
.menu button { text-align: left; padding: 7px 10px; background: transparent; border: 0; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
.menu button:hover { background: var(--hover); }
.menu small { color: var(--muted); }

/* banners and issues */
#banners { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 9px 12px; border: 1px solid var(--line); background: var(--info-bg); }
.banner.warn { background: var(--warn-bg); border-color: var(--warn); color: var(--ink); }
.banner.err { background: var(--err-bg); border-color: var(--err); }
.banner .bmsg { flex: 1 1 320px; min-width: 0; }
.banner .bact { display: inline-flex; gap: 6px; }
#issues { border: 1px solid var(--line); background: var(--panel); margin-bottom: 12px; max-height: 260px; overflow: auto; }
.iss { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line2); }
.iss:last-child { border-bottom: 0; }
.iss .ico { display: grid; place-items: center; }
.ico.err, .fl.err, .gfl.err { color: var(--err); }
.ico.warn, .fl.warn, .gfl.warn { color: var(--warn); }
.iss-txt { text-align: left; background: transparent; border: 0; padding: 2px 0; cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
.iss-txt:hover { text-decoration: underline; }
.iss-act { display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 560px) { .iss { grid-template-columns: 22px 1fr; } .iss-act { grid-column: 2; justify-content: flex-start; } }

/* table */
.twrap { overflow-x: auto; border: 1px solid var(--line); background: var(--panel); }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1140px; table-layout: fixed; }
th { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 7px 6px; background: var(--bg); border-bottom: 1.5px solid var(--ink); }
td { padding: 2px 3px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
col.k-n { width: 44px; } col.k-flag { width: 30px; } col.k-name { width: auto; } col.k-kind { width: 104px; } col.k-aud { width: 124px; } col.k-start { width: 214px; }
col.k-dur { width: 66px; } col.k-fin { width: 214px; } col.k-pred { width: 128px; } col.k-lock { width: 38px; } col.k-act { width: 142px; }
td input, td select { width: 100%; min-width: 0; padding: 5px 6px; border: 1px solid transparent; background: transparent; border-radius: 2px; }
td input:hover:not(:disabled), td select:hover:not(:disabled) { border-color: var(--line); }
td input:focus, td select:focus { border-color: var(--accent); background: var(--panel); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
td input[type=number] { text-align: right; }
td input.mono, td select { font-size: 12.5px; }
td input:disabled, td select:disabled { color: inherit; opacity: .6; }
.c-n { text-align: center; }
.rn { background: transparent; border: 0; color: var(--muted); font-family: var(--f-mono); font-size: 12px; cursor: pointer; padding: 4px 6px; }
.fl { background: transparent; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center; width: 100%; }
.dcell { display: flex; align-items: center; gap: 4px; position: relative; }
.dcell input { flex: 1 1 auto; }
.dcell.auto input { color: var(--muted); font-style: italic; }
.dow { flex: 0 0 28px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.dow.off { color: var(--err); font-weight: 500; }
.hold { flex: 0 0 auto; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 600; padding: 1px 6px; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 2px; cursor: pointer; }
.hold:hover { background: var(--accent); color: var(--on-accent); }
.lockb:not([aria-pressed="true"]) { opacity: .4; }
.lockb:not([aria-pressed="true"]):hover { opacity: .85; }
.lockb[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.lockb[aria-pressed="true"] rect { fill: currentColor; }
tr:hover td { background: var(--hover); }
tr.sel td { background: var(--sel); }
tr.err td:first-child { box-shadow: inset 3px 0 var(--err); }
tr.warn td:first-child { box-shadow: inset 3px 0 var(--warn); }
tr.ms td.c-name input { font-weight: 600; }
.t-empty { padding: 28px 16px; text-align: center; }
.c-act { white-space: nowrap; }

/* gantt */
.gwrap { display: grid; grid-template-columns: var(--gl, 240px) minmax(0, 1fr); border: 1px solid var(--line); background: var(--panel); }
.gl { border-right: 1.5px solid var(--ink); min-width: 0; }
.gh { height: 44px; display: flex; align-items: flex-end; padding: 0 10px 6px; border-bottom: 1.5px solid var(--ink); background: var(--bg); }
.grl { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px; border: 0; border-bottom: 1px solid var(--line2); background: transparent; text-align: left; cursor: pointer; }
.grl:hover { background: var(--hover); }
.grl.sel { background: var(--sel); }
.grl .rn { padding: 0; width: 22px; text-align: right; flex: none; cursor: inherit; }
.grl .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grl.ms .nm { font-weight: 600; }
.gfl { flex: none; display: grid; place-items: center; width: 15px; }
.gc { overflow-x: auto; min-width: 0; }
.gin { position: relative; }
.mo { position: absolute; top: 0; height: 22px; padding: 4px 6px; font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; border-left: 1px solid var(--line); }
.mo.m2 { border-left: 1px solid var(--line); font-weight: 500; color: var(--ink); }
.tk { position: absolute; top: 22px; height: 22px; font: 11px/1.1 var(--f-mono); color: var(--ink); padding: 3px 0 0 3px; display: flex; flex-direction: column; overflow: visible; white-space: nowrap; }
.tk small { font-size: 9px; color: var(--muted); }
.tk.off { color: var(--muted); }
.gin::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 44px; background: var(--bg); border-bottom: 1.5px solid var(--ink); }
.mo, .tk { z-index: 1; }
.wk { position: absolute; background: var(--wknd); }
.hl { position: absolute; background: repeating-linear-gradient(135deg, var(--hol) 0 3px, transparent 3px 6px), var(--wknd); }
.wl { position: absolute; width: 1px; background: var(--line2); z-index: 1; }
.rl { position: absolute; left: 0; right: 0; height: 1px; background: var(--line2); }
.selband { position: absolute; left: 0; right: 0; height: 30px; background: var(--sel); opacity: .7; }
.today { position: absolute; top: 44px; bottom: 0; width: 2px; background: var(--today); z-index: 2; }
.today-tag { position: absolute; top: 28px; transform: translateX(-50%); z-index: 3; background: var(--today); color: #fff; font: 600 10px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; padding: 3px 5px; }
.deps { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; }
.dp { fill: none; stroke: var(--muted); stroke-width: 1.1; }
.dh { fill: var(--muted); }
.dp.hot { stroke: var(--accent); stroke-width: 2; }
.dh.hot { fill: var(--accent); }
.deps.has-sel .dp:not(.hot), .deps.has-sel .dh:not(.hot) { opacity: .3; }
.bar { position: absolute; height: 16px; background: var(--bar); border-radius: 2px; z-index: 4; cursor: pointer; }
.bar.held { outline: 1.5px dashed var(--ink); outline-offset: 1px; }
.bar.lk { box-shadow: inset 0 0 0 1.5px var(--ink); }
.bar.lk.wr { box-shadow: inset 0 0 0 1.5px var(--ink), inset 0 -3px 0 var(--warn); }
.bar .bl { position: absolute; right: 3px; top: 2px; width: 10px; height: 10px; color: #fff; pointer-events: none; }
.bar .bl svg { width: 10px; height: 10px; display: block; }
.bar.err { outline: 2px solid var(--err); outline-offset: 1px; }
.bar.wr { box-shadow: inset 0 -3px 0 var(--warn); }
.dia { position: absolute; width: 14px; height: 14px; transform: rotate(45deg); background: var(--accent); z-index: 4; cursor: pointer; }
.dia.lk { box-shadow: 0 0 0 2px var(--ink); }
.dia.err { outline: 2px solid var(--err); outline-offset: 1px; }
.blab { position: absolute; z-index: 4; font: 11px/14px var(--f-mono); color: var(--muted); white-space: nowrap; pointer-events: none; }

/* empty state, dialogs, toast */
#empty { border: 1.5px dashed var(--line); padding: 36px 22px; background: var(--panel); max-width: 720px; }
#empty .row, .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 24, .55); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; overflow: auto; z-index: 50; }
.dlg { background: var(--panel); border: 1.5px solid var(--ink); padding: 16px 18px; width: 100%; max-width: 480px; max-height: 84vh; overflow: auto; }
.dlg.wide { max-width: 680px; }
.dlg.xwide { max-width: 1000px; }
.dlg-act { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.form { display: flex; flex-direction: column; gap: 8px; }
.form label.chk, label.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.txt { padding: 6px 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 2px; width: 100%; min-width: 0; }
.txt.sm { width: auto; }
.hol-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
.hol-list { display: flex; flex-direction: column; gap: 4px; max-height: 40vh; overflow: auto; padding-right: 2px; }
.hol-row { display: grid; grid-template-columns: 150px 1fr 28px; gap: 6px; align-items: center; }
@media (max-width: 480px) { .hol-row { grid-template-columns: 1fr 28px; } .hol-row .mono { grid-column: 1 / 2; } .hol-row input[type=text] { grid-column: 1 / 2; } }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 60; background: var(--ink); color: var(--panel); padding: 9px 14px; max-width: min(92vw, 520px); display: flex; gap: 14px; align-items: center; font-size: 13px; }
#toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast-act { background: transparent; border: 0; color: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

@media (max-width: 720px) {
  .sheet { grid-template-columns: 1fr 1fr; }
  .cell:first-child { grid-column: 1 / -1; border-bottom: 1px solid var(--ink); }
  .cell:nth-child(3) { border-left: 0; }
  .cell:nth-child(4) { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--ink); }
}

/* export dialog */
.xo { display: grid; grid-template-columns: minmax(0, 270px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .xo { grid-template-columns: minmax(0, 1fr); } }
.xo-form { display: flex; flex-direction: column; gap: 10px; }
.xo-form fieldset { margin: 0; padding: 8px 10px 10px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.xo-form legend { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
.xo-field { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.xo-prev { border: 1px solid var(--line); background: #fff; overflow: auto; max-height: 62vh; position: sticky; top: 0; }
.xo-prev canvas { display: block; width: 100%; height: auto; min-width: 560px; }
.xo-note { margin: 0; padding: 6px 10px; background: var(--panel); }
.xo-scale { margin: 0; font-size: 13px; }

/* scale picker */
.btn.icon { padding: 5px 8px; }
.menu.left { left: 0; right: auto; }
.menu-head { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 4px; }
.menu-foot { font-size: 12px; color: var(--muted); padding: 6px 10px 6px; border-top: 1px solid var(--line2); margin-top: 4px; max-width: 230px; }
.menu button[role=menuitemradio] > span:first-child { display: flex; flex-direction: column; }
.menu .tick { visibility: hidden; color: var(--accent); font-weight: 700; align-self: center; }
.menu button[aria-checked="true"] .tick { visibility: visible; }
.menu button[aria-checked="true"] strong { color: var(--accent); }

/* typed dates with an optional calendar picker */
.pick { position: relative; flex: none; width: 24px; height: 24px; display: grid; place-items: center; color: var(--muted); border: 1px solid transparent; border-radius: 2px; }
.pick:hover { color: var(--ink); border-color: var(--line); background: var(--panel); }

<script>
(function () {
'use strict';
/* ===== Scheduling engine (pure, no DOM) ===== */
const DAY_MS = 86400000;
const DOW_S = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_L = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON_S = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_L = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function parseDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return NaN;
  return Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / DAY_MS);
}
function fmtISO(n) {
  const d = new Date(n * DAY_MS);
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
}
function dowOf(n) { return new Date(n * DAY_MS).getUTCDay(); }
function ymdOf(n) { const d = new Date(n * DAY_MS); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() }; }
function fmtShort(n) { const p = ymdOf(n); return DOW_S[dowOf(n)] + ' ' + MON_S[p.m] + ' ' + p.d; }
function fmtMed(n) { const p = ymdOf(n); return MON_S[p.m] + ' ' + p.d + ', ' + p.y; }
function fmtLong(n) { const p = ymdOf(n); return DOW_S[dowOf(n)] + ' ' + MON_S[p.m] + ' ' + p.d + ', ' + p.y; }
function dayNum(y, m, d) { return Math.round(Date.UTC(y, m, d) / DAY_MS); }

/* ----- typed dates: 10/15, 10/15/26, Oct 15, 15 Oct 2026, 2026-10-15, today, +7, -3 ----- */
const MONTH_WORDS = { jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2, apr: 3, april: 3, may: 4, jun: 5, june: 5, jul: 6, july: 6, aug: 7, august: 7, sep: 8, sept: 8, september: 8, oct: 9, october: 9, nov: 10, november: 10, dec: 11, december: 11 };
function parseTyped(text, ref, today) {
  let s = String(text == null ? '' : text).trim().toLowerCase().replace(/\s+/g, ' ');
  if (!s) return NaN;
  const mk = (y, m, d) => {
    if (!(m >= 0 && m <= 11 && d >= 1 && d <= 31)) return NaN;
    const n = dayNum(y, m, d), p = ymdOf(n);
    return p.y === y && p.m === m && p.d === d ? n : NaN;
  };
  const refDay = isNaN(ref) || ref == null ? today : ref;
  const near = (m, d) => {
    const ry = ymdOf(refDay).y;
    let best = NaN;
    for (const y of [ry - 1, ry, ry + 1]) {
      const n = mk(y, m, d);
      if (!isNaN(n) && (isNaN(best) || Math.abs(n - refDay) < Math.abs(best - refDay))) best = n;
    }
    return best;
  };
  const yr = (v) => (v.length === 2 ? 2000 + parseInt(v, 10) : parseInt(v, 10));
  let m;
  if (s === 'today') return today;
  if ((m = /^([+-])\s?(\d{1,4})$/.exec(s))) return refDay + (m[1] === '-' ? -1 : 1) * parseInt(m[2], 10);
  s = s.replace(/^(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?,?\s+/, '');
  if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s))) return mk(+m[1], +m[2] - 1, +m[3]);
  if ((m = /^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{4}|\d{2}))?$/.exec(s))) return m[3] ? mk(yr(m[3]), +m[1] - 1, +m[2]) : near(+m[1] - 1, +m[2]);
  if ((m = /^([a-z]+)\.? (\d{1,2})(?:st|nd|rd|th)?(?:,? ?(\d{4}|\d{2}))?$/.exec(s)) && m[1] in MONTH_WORDS) return m[3] ? mk(yr(m[3]), MONTH_WORDS[m[1]], +m[2]) : near(MONTH_WORDS[m[1]], +m[2]);
  if ((m = /^(\d{1,2})(?:st|nd|rd|th)? ([a-z]+)\.?(?:,? ?(\d{4}|\d{2}))?$/.exec(s)) && m[2] in MONTH_WORDS) return m[3] ? mk(yr(m[3]), MONTH_WORDS[m[2]], +m[1]) : near(MONTH_WORDS[m[2]], +m[1]);
  return NaN;
}

/* ----- calendar: weekends + holiday list ----- */
const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
/* non-working weekdays, 0 = Sunday. Default Saturday and Sunday. An empty list means every day works; seven days off is not allowed. */
function normOffDays(a) {
  if (!Array.isArray(a)) return [0, 6];
  const s = new Set(a.map(Number).filter((n) => Number.isInteger(n) && n >= 0 && n <= 6));
  return s.size >= 7 ? [0, 6] : [...s].sort((x, y) => x - y);
}
function makeCalendar(holidays, offDays) {
  const off = new Set(normOffDays(offDays));
  const hol = new Map();
  for (const h of holidays || []) {
    const n = parseDate(h.date);
    if (!isNaN(n)) hol.set(n, h.name || 'Holiday');
  }
  const reason = (n) => {
    if (hol.has(n)) return hol.get(n);
    const d = dowOf(n);
    return off.has(d) ? DAY_NAMES[d] : null;
  };
  const isWork = (n) => reason(n) === null;
  const next = (n) => { let i = 0; while (!isWork(n) && i < 400) { n++; i++; } return n; };
  return { reason, isWork, next, holidays: hol, isHoliday: (n) => hol.has(n), offDays: [...off] };
}

/* ----- holiday generator (U.S. federal, observed dates; optional Utah Pioneer Day) ----- */
function nthWeekday(y, m, wd, n) {
  const first = dayNum(y, m, 1);
  const shift = (wd - dowOf(first) + 7) % 7;
  return first + shift + (n - 1) * 7;
}
function lastWeekday(y, m, wd) {
  const last = dayNum(y, m + 1, 0);
  return last - ((dowOf(last) - wd + 7) % 7);
}
function observed(n) {
  const d = dowOf(n);
  if (d === 6) return { n: n - 1, shifted: true };
  if (d === 0) return { n: n + 1, shifted: true };
  return { n, shifted: false };
}
function generateHolidays(year, withPioneer) {
  const fixed = (m, d, name) => ({ n: dayNum(year, m, d), name });
  const list = [
    fixed(0, 1, "New Year's Day"),
    { n: nthWeekday(year, 0, 1, 3), name: 'Martin Luther King Jr. Day', floating: true },
    { n: nthWeekday(year, 1, 1, 3), name: "Presidents' Day", floating: true },
    { n: lastWeekday(year, 4, 1), name: 'Memorial Day', floating: true },
    fixed(5, 19, 'Juneteenth'),
    fixed(6, 4, 'Independence Day'),
    { n: nthWeekday(year, 8, 1, 1), name: 'Labor Day', floating: true },
    { n: nthWeekday(year, 9, 1, 2), name: "Columbus / Indigenous Peoples' Day", floating: true },
    fixed(10, 11, 'Veterans Day'),
    { n: nthWeekday(year, 10, 4, 4), name: 'Thanksgiving', floating: true },
    fixed(11, 25, 'Christmas Day'),
  ];
  if (withPioneer) list.push(fixed(6, 24, 'Pioneer Day (Utah)'));
  return list.map((h) => {
    if (h.floating) return { date: fmtISO(h.n), name: h.name };
    const o = observed(h.n);
    return { date: fmtISO(o.n), name: o.shifted ? h.name + ' (observed)' : h.name };
  });
}

/* ----- predecessor text:  "3, 5SS+2, 4FS-1" ----- */
function formatPreds(task, tasks) {
  const idx = new Map(tasks.map((t, i) => [t.id, i + 1]));
  return (task.deps || [])
    .filter((d) => idx.has(d.id))
    .map((d) => {
      const lag = d.lag || 0;
      return idx.get(d.id) + (d.type === 'SS' ? 'SS' : '') + (lag ? (lag > 0 ? '+' : '-') + Math.abs(lag) : '');
    })
    .join(', ');
}
function parsePreds(text, tasks, selfId) {
  const out = new Map();
  const parts = String(text || '').split(/[,;]+/).map((s) => s.trim()).filter(Boolean);
  for (const tok of parts) {
    const m = /^(\d+)\s*(fs|ss)?\s*([+-]\s*\d+)?\s*(d|day|days)?$/i.exec(tok);
    if (!m) return { error: '“' + tok + '” isn’t a valid predecessor. Use a row number, like 3, 5SS+2 or 4FS-1.' };
    const row = parseInt(m[1], 10);
    const t = tasks[row - 1];
    if (!t) return { error: 'There is no row ' + row + '.' };
    if (t.id === selfId) return { error: 'A task can’t depend on itself.' };
    out.set(t.id, { id: t.id, type: (m[2] || 'FS').toUpperCase(), lag: m[3] ? parseInt(m[3].replace(/\s+/g, ''), 10) : 0 });
  }

}
function wouldCycle(tasks, taskId, depIds) {
  const byId = new Map(tasks.map((t) => [t.id, t]));
  const seen = new Set();
  const stack = [...depIds];
  while (stack.length) {
    const id = stack.pop();
    if (id === taskId) return true;
    if (seen.has(id)) continue;
    seen.add(id);
    const t = byId.get(id);
    if (t) for (const d of t.deps || []) stack.push(d.id);
  }
  return false;
}

/* ----- the cascade -----
   Task: {id,name,kind:'task'|'milestone',start:'YYYY-MM-DD',duration,locked,notBefore,deps:[{id,type,lag}],ignore:[]}
   - No predecessors: start is the date entered (anchored).
   - Predecessors: start = latest date the links allow, or "notBefore" if later (a hold).
   - Locked: start never moves; a conflict is flagged if predecessors need a later date.
   end is exclusive (start + duration); finish is the last day the task occupies. */
function schedule(tasks, cal) {
  const ids = new Set(tasks.map((t) => t.id));
  const preds = new Map();
  const succs = new Map(tasks.map((t) => [t.id, []]));
  for (const t of tasks) {
    const seen = new Set();
    const ds = [];
    for (const d of t.deps || []) {
      if (d.id === t.id || !ids.has(d.id) || seen.has(d.id)) continue;
      seen.add(d.id);
      ds.push(d);
      succs.get(d.id).push(t.id);
    }
    preds.set(t.id, ds);
  }
  const indeg = new Map(tasks.map((t) => [t.id, preds.get(t.id).length]));
  const queue = tasks.filter((t) => indeg.get(t.id) === 0).map((t) => t.id);
  const order = [];
  while (queue.length) {
    const id = queue.shift();
    order.push(id);
    for (const s of succs.get(id)) {
      indeg.set(s, indeg.get(s) - 1);
      if (indeg.get(s) === 0) queue.push(s);
    }
  }
  const done = new Set(order);
  const cyc = tasks.filter((t) => !done.has(t.id)).map((t) => t.id);
  const byId = new Map(tasks.map((t) => [t.id, t]));
  const res = new Map();

  const run = (t, inCycle) => {
    const kind = t.kind === 'milestone' ? 'milestone' : 'task';
    const dur = kind === 'milestone' ? 0 : Math.max(1, Math.round(+t.duration || 1));
    const ds = inCycle ? [] : preds.get(t.id);
    const anchorDay = parseDate(t.start);
    let driven = null, drivenBy = null;
    for (const d of ds) {
      const p = res.get(d.id);
      const lag = d.lag || 0;
      const v = d.type === 'SS' ? p.start + lag : p.end + lag;
      if (driven === null || v > driven) { driven = v; drivenBy = d.id; }
    }
    const nb = t.notBefore ? parseDate(t.notBefore) : NaN;

    if (ds.length === 0) {
      start = isNaN(anchorDay) ? (cal.next(Math.floor(Date.now() / DAY_MS))) : anchorDay;
    } else {
      start = driven;
      if (!isNaN(nb) && nb > driven) { start = nb; held = true; }
    }
    const flags = [];
    const ign = (c) => (t.ignore || []).includes(c);
    if (t.locked && !isNaN(anchorDay)) {
      if (ds.length && driven > anchorDay) {
        const late = driven - anchorDay;
        flags.push({
          code: 'lockConflict', level: 'error',
          text: 'Locked for ' + fmtShort(anchorDay) + ', but predecessors push it to ' + fmtShort(driven) + ' (' + late + (late === 1 ? ' day' : ' days') + ' late)',
          fix: { type: 'setStart', date: fmtISO(driven), label: 'Move to ' + fmtShort(driven) },
        });
      }
      start = anchorDay;
      held = false;
    }
    const end = start + dur;
    const finish = dur > 0 ? end - 1 : start;
    if (inCycle) flags.push({ code: 'cycle', level: 'error', text: 'Part of a circular dependency. Remove one of the links.' });
    const r0 = cal.reason(start);
    if (kind === 'milestone') {
      if (r0) {
        const nx = cal.next(start);
        flags.push({ code: 'milestoneNonwork', level: 'error', text: 'Falls on ' + r0 + ' (' + fmtShort(start) + ')', fix: { type: 'setStart', date: fmtISO(nx), label: 'Move to ' + fmtShort(nx) } });
      }
    } else {
      if (r0 && !ign('startNonwork')) {
        const nx = cal.next(start);
        flags.push({ code: 'startNonwork', level: 'warn', text: 'Starts on ' + r0 + ' (' + fmtShort(start) + ')', fix: { type: 'setStart', date: fmtISO(nx), label: 'Start ' + fmtShort(nx) }, ignorable: true });
      }
      const r1 = cal.reason(finish);
      if (r1 && !ign('finishNonwork')) {
        const nx = cal.next(finish);
        flags.push({ code: 'finishNonwork', level: 'warn', text: 'Finishes on ' + r1 + ' (' + fmtShort(finish) + ')', fix: { type: 'setDuration', dur: nx - start + 1, label: 'Extend to ' + fmtShort(nx) }, ignorable: true });
      }
    }
    res.set(t.id, { id: t.id, kind, dur, start, end, finish, driven, drivenBy, held, locked: !!t.locked, anchored: ds.length === 0, cycle: !!inCycle, flags });
  };
  for (const id of order) run(byId.get(id), false);
  for (const id of cyc) run(byId.get(id), true);
  return res;
}

/* ===== Three-way merge of two edited copies of one schedule (pure, no DOM) =====
   base   = the version I loaded (or last saved)
   mine   = what is on my screen now
   theirs = the latest saved version, which someone else saved after my base
   All three are normalized working copies (see docToWork). Tasks are matched by id and merged field by field.
   Dates the engine computes (a task that follows predecessors and is not locked) are NOT inputs and are never compared;
   the caller recalculates after merging.
   choices: { [conflict key]: 'mine' | 'theirs' }. A conflict with no choice keeps THEIRS, so nothing already saved is lost silently. */

const jeq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const jclone = (x) => (x === undefined ? undefined : JSON.parse(JSON.stringify(x)));
const isDerived = (t) => !!(t && t.deps && t.deps.length && !t.locked);
const startInput = (t) => (isDerived(t) ? null : t.start);
const depKey = (d) => (d ? d.type + ':' + (d.lag || 0) : null);
const depText = (d) => (d ? (d.type === 'SS' ? 'start-to-start' : 'finish-to-start') + (d.lag ? ' ' + (d.lag > 0 ? '+' : '') + d.lag + 'd' : '') : 'no link');

/* one value, three versions */
function pick3(b, m, t) {
  if (jeq(m, t)) return { v: m };
  if (jeq(m, b)) return { v: t };
  if (jeq(t, b)) return { v: m };
  return { v: t, conflict: true };
}
/* the part of a task a person actually sets */
function taskSig(t) {
  if (!t) return '';
  const deps = (t.deps || []).map((d) => d.id + ':' + depKey(d)).sort();
  return JSON.stringify([t.name, t.kind, t.duration, t.locked, t.notBefore, t.lvl, t.exec, t.exColor, deps, (t.ignore || []).slice().sort(), startInput(t)]);
}

function merge3(base, mine, theirs, choices) {
  choices = choices || {};
  const conflicts = [];
  const take = (key, label, b, m, t, show) => {
    const r = pick3(b, m, t);
    if (!r.conflict) return r.v;
    conflicts.push({ key, label, mine: show ? show(m) : String(m), theirs: show ? show(t) : String(t) });
    return choices[key] === 'mine' ? m : t;

  const mapOf = (w) => new Map(((w && w.tasks) || []).map((t) => [t.id, t]));
  const B = mapOf(base), M = mapOf(mine), T = mapOf(theirs);

    return i < 0 ? '' : '#' + (i + 1) + ' ';
  };
  const nameOf = (id) => { const t = M.get(id) || T.get(id) || B.get(id); return t ? (t.name || 'Untitled') : 'Untitled'; };
  const tl = (id) => 'Task ' + rowOf(id) + '“' + nameOf(id) + '”';

  // ---- which tasks survive
  const ids = new Set([...B.keys(), ...M.keys(), ...T.keys()]);
  const kept = new Map(); // id -> merged task
  for (const id of ids) {
    const b = B.get(id), m = M.get(id), t = T.get(id);
    if (!m && !t) continue; // gone on both sides
    if (m && !t) {
      if (!b) { kept.set(id, jclone(m)); continue; } // I added it
      if (taskSig(m) === taskSig(b)) continue; // they deleted it, I never touched it
      const pick = take('task:' + id + ':delete', tl(id) + ' was deleted by someone else, and you changed it', 'x', 'edit', 'del', (v) => (v === 'del' ? 'Delete the task' : 'Keep it with your changes'));
      if (pick === 'edit') kept.set(id, jclone(m));
      continue;
    }
    if (!m && t) {

/* ----- bar color picker (Executive view and export only) ----- */
function openColorPick(anchor, cur, onPick, o) {
  o = o || {};
  const old = document.querySelector('.cpick');
  if (old) old.remove();
  cur = normColor(cur);
  const close = () => { const m = document.querySelector('.cpick'); if (m) m.remove(); document.removeEventListener('pointerdown', away, true); document.removeEventListener('keydown', esc, true); };
  const away = (e) => { if (!e.target.closest('.cpick') && e.target !== anchor) close(); };
  const esc = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } }; // closes only the picker, not a dialog behind it
  const menu = h('div', { class: 'cpick', role: 'dialog', 'aria-label': 'Choose a bar color' });
  const place = () => {
    const r = anchor.getBoundingClientRect();
    menu.style.top = Math.max(8, Math.min(window.innerHeight - menu.offsetHeight - 8, r.bottom + 4)) + 'px';
    menu.style.left = Math.max(8, Math.min(window.innerWidth - menu.offsetWidth - 8, r.left - 20)) + 'px';
  };
  const sw = (v, label, extra) => {
    const b = h('button', { type: 'button', class: 'swatch', title: label, 'aria-label': label, 'aria-pressed': String(cur === v) });
    b.style.background = colorCss(v);
    b.addEventListener('click', () => { close(); onPick(v); });
    return extra ? h('span', { class: 'cw' }, b, extra) : b;
  };
  let adding = false;
  const paint = () => {
    menu.textContent = '';
    menu.append(h('p', { class: 'muted', text: o.title || 'Bar color for this task' }));
    menu.append(h('div', { class: 'swatches', role: 'group', 'aria-label': 'Standard colors' }, Object.keys(PRESETS).map((p) => sw(p, PRESETS[p].label))));
    const mine = validCustom(S.work.customColors);
    menu.append(h('h4', { text: 'This project\u2019s colors' }));
    const row = h('div', { class: 'swatches', role: 'group', 'aria-label': 'Project colors' });
    for (const c of mine) {
      const x = S.readonly ? null : h('button', { type: 'button', class: 'cx', title: 'Remove ' + c.toUpperCase() + ' from this project\u2019s colors. Bars already using it keep it.', 'aria-label': 'Remove ' + c.toUpperCase(), text: '\u00d7',
        onclick: (e) => { e.stopPropagation(); removeCustomColor(c); paint(); place(); } });
      row.append(sw(c, 'Custom ' + c.toUpperCase(), x));
    }
    if (!S.readonly) row.append(h('button', { type: 'button', class: 'addc', title: 'Add a custom color to this project', 'aria-label': 'Add a custom color', 'aria-expanded': String(adding), text: '+', onclick: () => { adding = !adding; paint(); place(); } }));
    menu.append(row);
    if (!mine.length && !adding) menu.append(h('p', { class: 'muted td-note', text: 'Use + to save a custom color for everyone on this project.' }));
    if (adding) {
      const pick = h('input', { type: 'color', value: '#3b79c3', 'aria-label': 'Pick a color' });
      const hex = h('input', { type: 'text', class: 'txt mono', value: '#3B79C3', maxlength: '7', 'aria-label': 'Hex color', spellcheck: 'false', autocomplete: 'off' });
      const add = h('button', { type: 'button', class: 'btn sm primary', text: 'Add color' });
      const ok = () => HEX_RE.test(hex.value.trim().startsWith('#') ? hex.value.trim() : '#' + hex.value.trim());
      const val = () => { const v = hex.value.trim(); return v.startsWith('#') ? v : '#' + v; };
      pick.addEventListener('input', () => { hex.value = pick.value.toUpperCase(); add.disabled = false; });
      hex.addEventListener('input', () => { add.disabled = !ok(); if (ok()) pick.value = val().toLowerCase(); });
      hex.addEventListener('keydown', (e) => { if (e.key === 'Enter' && ok()) add.click(); });
      add.addEventListener('click', () => { if (!ok()) return; const c = addCustomColor(val()); if (c) { close(); onPick(c); } });
      menu.append(h('div', { class: 'newc' }, pick, hex, add));
    }
    if (!o.noDefault) menu.append(h('button', { type: 'button', class: 'btn sm ghost dflt', text: 'Use the default color', onclick: () => { close(); onPick(null); } }));
  };
  paint();
  document.body.append(menu);
  place();
  document.addEventListener('pointerdown', away, true);
  document.addEventListener('keydown', esc, true);
}

/* ===== Gantt link dragging and the task details popup ===== */

const LINK_NAME = { FS: 'finish-to-start', SS: 'start-to-start' };
const taskLabel = (t, i) => (i + 1) + '. ' + (t.name || 'Untitled');

/* Can `succ` be made to follow `pred`? Returns {ok, why}. */
function canLink(predId, succId) {
  if (predId === succId) return { ok: false, why: 'A task can’t follow itself' };
  const succ = taskById(succId);
  if (!succ) return { ok: false, why: '' };
  if (wouldCycle(S.work.tasks, succId, [predId])) return { ok: false, why: 'That would create a loop' };
  return { ok: true, why: '' };
}

/* Create (or retype) the link pred -> succ. Returns a short result string. */
function linkTasks(predId, succId, type) {
  const chk = canLink(predId, succId);
  if (!chk.ok) { toast(chk.why + '.'); return false; }
  const succ = taskById(succId), pred = taskById(predId);
  const had = (succ.deps || []).find((d) => d.id === predId);
  if (had && had.type === type) { toast('Those two are already linked that way.'); return false; }
  edit(() => {
    if (had) had.type = type;
    else (succ.deps = succ.deps || []).push({ id: predId, type, lag: 0 });
  });
  S.sel = succId;
  renderAll();
  const nm = (t) => '“' + (t.name || 'Untitled') + '”';
  toast((had ? 'Changed the link: ' : 'Linked: ') + nm(succ) + ' ' + (type === 'FS' ? 'starts after ' + nm(pred) + ' finishes.' : 'starts when ' + nm(pred) + ' starts.'), { label: 'Undo', run: undo });
  return true;
}

/* ----- drag a node from one bar onto another task ----- */
function startLinkDrag(e, src) {
  if (S.readonly || (e.button != null && e.button > 0)) return;
  e.preventDefault();
  e.stopPropagation();
  const { gin, tasks, rows } = src;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'dragsvg');
  svg.setAttribute('width', gin.style.width); svg.setAttribute('height', gin.style.height);
  const line = document.createElementNS(NS, 'path');
  line.setAttribute('class', 'dragline');
  svg.append(line);
  const band = h('div', { class: 'dropband' });
  band.style.display = 'none';
  const tip = h('div', { class: 'dragtip' });
  tip.style.display = 'none';
  gin.append(band, svg, tip);
  const wrap = gin.querySelector('.bw[data-id="' + src.id + '"]');
  if (wrap) wrap.classList.add('dragsrc');
  document.body.classList.add('linking');
  const srcTask = taskById(src.id);
  const nm = (t) => '“' + (t.name || 'Untitled') + '”';
  let target = null;

  const pos = (ev) => { const b = gin.getBoundingClientRect(); return { x: ev.clientX - b.left, y: ev.clientY - b.top }; };
  const targetAt = (y) => {
    const i = Math.floor((y - GH) / GROW);
    return i >= 0 && i < tasks.length ? tasks[i] : null;
  };
  const move = (ev) => {
    const p = pos(ev);
    line.setAttribute('d', 'M' + src.x + ' ' + src.y + 'L' + p.x.toFixed(1) + ' ' + p.y.toFixed(1));
    const t = targetAt(p.y);
    target = null;
    if (!t || t.id === src.id) { band.style.display = 'none'; tip.style.display = 'none'; return; }
    const chk = canLink(src.id, t.id);
    const existing = (t.deps || []).find((d) => d.id === src.id);
    const type = src.end === 'finish' ? 'FS' : 'SS';
    const same = existing && existing.type === type;
    const ok = chk.ok && !same;
    if (ok) target = t;
    const ti = tasks.indexOf(t);
    band.style.display = 'block';
    band.style.top = GH + ti * GROW + 'px';
    band.className = 'dropband ' + (ok ? 'ok' : 'bad');
    tip.style.display = 'block';
    tip.className = 'dragtip ' + (ok ? 'ok' : 'bad');
    tip.textContent = !chk.ok ? chk.why : same ? 'Already linked this way'
      : nm(t) + (type === 'FS' ? ' will start after ' + nm(srcTask) + ' finishes' : ' will start when ' + nm(srcTask) + ' starts');
    tip.style.left = Math.min(p.x + 14, parseFloat(gin.style.width) - 200) + 'px';
    tip.style.top = p.y + 14 + 'px';
  };
  const done = (commit) => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', cancel);
    document.removeEventListener('keydown', key);
    document.body.classList.remove('linking');
    band.remove(); svg.remove(); tip.remove();
    if (wrap) wrap.classList.remove('dragsrc');
    if (commit && target) linkTasks(src.id, target.id, src.end === 'finish' ? 'FS' : 'SS');
  };
  const up = (ev) => { move(ev); done(true); };
  const cancel = () => done(false);
  const key = (ev) => { if (ev.key === 'Escape') done(false); };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', cancel);
  document.addEventListener('keydown', key);
  move(e);
}

const LIBS = {

  pdf: { url: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', get: () => window.jspdf },

const libCache = {};
function loadLib(k) {
  if (LIBS[k].get()) return Promise.resolve(LIBS[k].get());

      const s = document.createElement('script');
      s.src = LIBS[k].url;
      s.onload = () => (LIBS[k].get() ? res(LIBS[k].get()) : rej(new Error('missing')));

// An export type is an audience level (each includes its own level and everything below it),

const xTypes = () => (S.work && S.work.execOn ? ['executive'].concat(LEVELS) : LEVELS.slice());

const typeLabel = (type) => (type === 'executive' ? 'Executive summary' : LEVEL_INFO[type].label);
function stemName() {
  return (S.work.name || 'schedule').replace(/[^\w\- ]+/g, '').replace(/\s+/g, ' ').trim() || 'schedule';
}
function fileName(type, ext) { return stemName() + ' - ' + typeLabel(type) + ' - ' + fmtISO(todayDay()) + '.' + ext; }

    const r = await S.dl.save({ filename, data });
    if (r && r.status === 'saved') toast('Saved ' + filename + '.');
  } catch (e) {

/* the task table for one export type. Hidden tasks are removed (not just hidden), rows renumbered, links to hidden tasks dropped. */
function tableData(type, O) {
  const rank = xRank(type), tasks = exportTasks(type), full = type === 'internal';
  // baseline columns only when the project has it on AND this export keeps it; an export can never add it on its own
  const withBase = baseActive() && !!(O && O.baseline);
  const head = ['#', 'Task', 'Type', 'Start', 'Days', 'Finish', 'Predecessors'].concat(withBase ? ['Baseline start', 'Baseline finish', 'Slip (days)'] : [], full ? ['Audience', 'Locked', 'Held', 'Issues'] : []);

    const r = S.res.get(t.id);
    const row = [i + 1, t.name, t.kind === 'milestone' ? 'Milestone' : 'Task', r.start, r.kind === 'milestone' ? 0 : r.dur, r.finish, formatPreds(t, tasks)];
    if (withBase) { const b = baseRow(t.id), n = slipOf(t.id); row.push(b ? b.start : '', b ? (b.kind === 'milestone' ? b.start : b.finish) : '', n == null ? 'new' : n); }
    return full ? row.concat([LEVEL_INFO[t.lvl || 'client'].label, t.locked ? 'Yes' : '', r.held ? 'Yes' : '', r.flags.map((f) => f.text).join('; ')]) : row;

function buildCSV(type, O) {

  const L = exportLayout(O);
  const plan = planPages(L, O);
  const total = plan.rowPages * plan.wins.length;
  const doc = new lib.jsPDF({ orientation: 'landscape', unit: 'pt', format: [plan.P.h, plan.P.w] });
  let k = 0;
  for (let rp = 0; rp < plan.rowPages; rp++) {
    const i0 = rp * plan.perPage, i1 = Math.min(L.tasks.length, i0 + plan.perPage);
    for (const win of plan.wins) {
      k++;
      const { cv, W: w, H: hh } = drawExportPage(L, i0, i1, k, total, 6000, win);
      if (k > 1) doc.addPage();
      doc.addImage(cv.toDataURL('image/png'), 'PNG', plan.M, plan.M, w * plan.s, hh * plan.s);
    }
  }
  return doc.output('arraybuffer');
}
/* one file per selected type; several files go out as a single zip */
async function runExportJob(kind, types, Os) {
  const files = [];
  for (const type of types) {
    const O = Object.assign({}, Os[type], { type });
    let data;
    if (kind === 'csv') data = buildCSV(type, Os[type]);
    else if (kind === 'xlsx') data = await buildXLSX(type, Os[type]);
    else if (kind === 'png') data = await buildPNG(O);
    else data = await buildPDF(O);
    files.push({ name: fileName(type, kind), data });
  }
  if (files.length === 1) return saveFile(files[0].name, files[0].data);
  const Z = await loadLib('zip');
  const z = new Z();
  for (const f of files) z.file(f.name, f.data);
  const out = await z.generateAsync({ type: 'uint8array', compression: 'DEFLATE' });
  return saveFile(stemName() + ' - exports - ' + fmtISO(todayDay()) + '.zip', out);
}

/* ----- export dialog ----- */
const KIND_LABEL = { pdf: 'PDF', png: 'image', xlsx: 'Excel file', csv: 'CSV file' };
function openExportDialog(kind) {
  const isPdf = kind === 'pdf', isGantt = kind === 'pdf' || kind === 'png';
  const XT = xTypes();
  const counts = Object.fromEntries(XT.map((t) => [t, exportTasks(t).length]));
  const picks = Object.fromEntries(XT.map((t) => [t, new Set(exportTasks(t).map((x) => x.id))]));
  const total = S.work.tasks.length;
  const Os = {};
  const optsOf = (type) => { if (!Os[type]) { Os[type] = loadXO(type); Os[type].desc = loadDesc(type) || S.work.info.issue || ''; } return Os[type]; };
  let active = null;
  try { active = localStorage.getItem('schedsheet:xtype'); } catch (e) { active = null; }
  if (!XT.includes(active) || !counts[active]) active = counts.internal ? 'internal' : (XT.find((t) => counts[t] > 0) || 'internal');

  const tabs = h('div', { class: 'xtabs', role: 'tablist', 'aria-label': 'Export for' });
  const info = h('div', { class: 'xt-info' });
  const shareBar = h('div', { class: 'xo-share' });
  const body = h('div');
  const preview = h('div', { class: 'xo-prev' });
  let timer = null, dlgApi = null;

  const updateButton = () => {
    if (!dlgApi) return;
    const go = dlgApi.dlg.querySelectorAll('.dlg-act button')[1];
    go.disabled = counts[active] === 0;
    go.textContent = 'Download ' + typeLabel(active) + ' ' + KIND_LABEL[kind];
  };
  const paintTabs = () => {
    tabs.textContent = '';
    for (const type of XT) {
      const n = counts[type];
      const btn = h('button', { type: 'button', role: 'tab', 'aria-selected': String(active === type), class: 'xtab-b', onclick: () => { active = type; paintAll(); } },
        h('strong', { text: typeLabel(type) }), h('small', { text: n + (n === 1 ? ' task' : ' tasks') }));
      tabs.append(h('div', { class: 'xtab' + (active === type ? ' on' : '') }, btn));
    }
  };
  const paintInfo = () => {
    const kept = counts[active], left = total - kept;
    info.textContent = '';
    info.append(h('p', { class: 'xt-sum' }, h('strong', { text: typeLabel(active) + ' export: ' }),
      kept + ' of ' + total + ' tasks. ' + (left ? left + ' left out.' : 'Nothing is left out.')));
    if (active === 'executive') {
      info.append(h('p', { class: 'muted xo-note', text: kept ? 'Only Client-level tasks marked Exec are included, for client executives.' : 'No tasks are marked for the executive summary yet. Check Exec on the Client-level tasks you want, in the Table.' }));
    }
    if (left) {
      const hidden = S.work.tasks.filter((t) => !picks[active].has(t.id));
      info.append(h('details', { class: 'xo-hidden' }, h('summary', { text: 'Show the ' + left + ' left out' }),
        h('ul', null, hidden.map((t) => h('li', null, (t.name || 'Untitled') + ' ', h('small', { class: 'muted', text: '(' + (active === 'executive' && lvRank(t) === 0 ? 'not marked Exec' : LEVEL_INFO[t.lvl || 'client'].label) + ')' }))))));
    }
    if (active !== 'internal') info.append(h('p', { class: 'muted xo-note', text: 'Dates still come from the full schedule, including the tasks left out. Locks, holds, issues and arrows to hidden tasks are not included.' }));
  };

  const redraw = () => {
    clearTimeout(timer);
    if (!isGantt) return;
    timer = setTimeout(async () => {
      if (optsOf(active).logo) await loadLogo();
      preview.textContent = '';
      try {
        const O = Object.assign({}, optsOf(active), { type: active });
        const L = exportLayout(O);
        const plan = isPdf ? planPages(L, O) : null;
        const rows = Math.min(L.tasks.length, plan ? plan.perPage : 16, 16);
        const { cv } = drawExportPage(L, 0, rows, 1, 1, 1500, plan ? plan.wins[0] : null);
        cv.setAttribute('aria-label', 'Preview of the first rows of the ' + typeLabel(active) + ' export');
        preview.append(cv);
        const pages = plan ? plan.rowPages * plan.wins.length : 1;
        const bits = [];
        if (L.tasks.length > rows) bits.push('Preview shows the first ' + rows + ' of ' + L.tasks.length + ' tasks.');
        if (plan && O.fit && plan.s < 0.6) bits.push('Fit to width prints at about ' + Math.round(plan.s * 100) + '% size, so text will be small. Try a coarser scale or a larger paper size.');
        if (plan) bits.push('The PDF will be ' + pages + (pages === 1 ? ' page' : ' pages') + (plan.wins.length > 1 ? ' (' + plan.wins.length + ' across, ' + plan.rowPages + ' down)' : '') + '.');
        if (bits.length) preview.append(h('p', { class: 'muted xo-note', text: bits.join(' ') }));
      } catch (e) { preview.append(h('p', { class: 'muted', text: 'Preview unavailable.' })); }
    }, 60);
  };

  const paintBody = () => {
    body.textContent = '';
    const O = optsOf(active), type = active;
    const chk = (key, label) => {
      const i = h('input', { type: 'checkbox', id: 'xo_' + key });
      i.checked = !!O[key];
      i.addEventListener('change', () => { O[key] = i.checked; if (key === 'descOn') descIn.disabled = !i.checked; if (isGantt) redraw(); else paintBody(); });
      return h('label', { class: 'chk', for: 'xo_' + key }, i, ' ' + label);
    };
    if (!isGantt) {
      const head = tableData(active, O).head;
      body.append(baseActive() ? chk('baseline', 'Include baseline and slip columns') : null,
        h('p', { class: 'muted', text: 'Columns: ' + head.join(', ') + '.' }),
        type !== 'internal' ? h('p', { class: 'muted', text: 'Issues, locks and holds are only included in the Internal file.' }) : null);
      return;
    }
    const sel = (key, label, opts) => {
      const s2 = h('select', { id: 'xo_' + key, class: 'txt' }, opts.map(([v, t]) => h('option', { value: v, text: t })));
      s2.value = O[key];
      s2.addEventListener('change', () => { O[key] = s2.value; redraw(); });
      return h('div', { class: 'xo-field' }, h('label', { for: 'xo_' + key, text: label }), s2);
    };
    const descIn = h('input', { type: 'text', id: 'xo_desc', class: 'txt', placeholder: 'e.g. Issued for owner review, rev 2', autocomplete: 'off', maxlength: '160' });
    descIn.value = O.desc || '';
    descIn.disabled = !O.descOn;
    descIn.addEventListener('input', () => { O.desc = descIn.value; redraw(); });
    const dateOpts = (both) => [['none', 'None'], ['start', 'Start'], ['finish', 'Finish'], [both, 'Start and finish']];
    body.append(h('div', { class: 'xo-form' },
      h('fieldset', null, h('legend', { text: 'Time scale' }),
        sel('scale', 'Scale for this export', [['auto', 'Same as the schedule (' + SCALES[scaleOf()].label + ')']].concat(Object.keys(SCALES).map((k) => [k, SCALES[k].label]))),
        h('p', { class: 'muted xo-note', text: 'Only changes the export. The schedule keeps its own scale.' })),
      h('fieldset', null, h('legend', { text: 'Dates' }),
        sel('ganttDates', 'Next to each bar', dateOpts('range')),
        sel('leftDates', 'In the task list on the left', dateOpts('both')),
        chk('dur', 'Show durations next to bars')),
      h('fieldset', null, h('legend', { text: 'Show' }),
        chk('numbers', 'Task numbers'), chk('arrows', 'Dependency arrows'), chk('today', 'Current date line'),
        chk('shade', 'Weekend and holiday shading'),
        baseActive() ? chk('baseline', 'Baseline and slip') : null,
        type === 'internal' ? chk('flags', 'Issue markers') : null,
        type === 'design' || type === 'internal' ? chk('catColors', 'Color by audience (with legend)') : null,
        chk('legend', 'Legend')),
      h('fieldset', null, h('legend', { text: 'Heading' }),
        projText() ? chk('projInfo', 'Project number and client') : null, chk('logo', 'Arch Nexus logo (top right)'), chk('saved', 'Last saved by and date'), chk('printed', 'Print date'), chk('descOn', 'Description under the title'), descIn),
      isPdf ? h('fieldset', null, h('legend', { text: 'Page' }),
        sel('paper', 'Paper size (landscape)', Object.keys(PAPER).map((k) => [k, PAPER[k].label])),
        chk('fit', 'Fit all dates on one page width'),
        h('p', { class: 'muted xo-note', text: 'Shrinks the chart so it never splits across pages sideways. A coarser scale (Weeks or Months) keeps the text readable on long projects.' })) : null));
  };
  /* project defaults: one shared look per report type, saved with the schedule */
  const paintShare = () => {
    shareBar.textContent = '';
    if (!isGantt) return;
    const t = active, label = typeLabel(t), shared = !!sharedXO(t), ro = S.readonly;
    shareBar.append(h('p', { class: 'muted xo-note' }, shared
      ? 'Using the project\u2019s ' + label + ' settings, shared with everyone on this project. Changes made here apply to this download only. The line under the title comes from the issue note in Project settings.'
      : 'These ' + label + ' settings are remembered on this device only.'));
    if (ro) return;
    const row = h('div', { class: 'xo-share-btns' });
    row.append(h('button', { type: 'button', class: 'btn sm', text: shared ? 'Update project default' : 'Share as the project default for ' + label,
      title: 'Save the options below with the project so everyone gets the same ' + label + ' look. Save the schedule afterwards to share it.',
      onclick: () => {
        const o = cleanXO(optsOf(t));
        edit(() => { S.work.exportDefaults = Object.assign({}, S.work.exportDefaults, { [t]: o }); });
        toast('Saved as the project default for the ' + label + ' export. Save the schedule to share it with the team.');
        paintAll();
      } }));
    if (shared) {
      row.append(h('button', { type: 'button', class: 'btn sm ghost', text: 'Reset to project default', onclick: () => { delete Os[t]; paintAll(); } }),
        h('button', { type: 'button', class: 'btn sm ghost', text: 'Stop sharing', title: 'Go back to settings remembered on each device',
          onclick: () => { edit(() => { const n = Object.assign({}, S.work.exportDefaults); delete n[t]; S.work.exportDefaults = n; }); delete Os[t]; paintAll(); } }));
    }
    shareBar.append(row);
  };
  const paintAll = () => { paintTabs(); paintInfo(); paintShare(); paintBody(); updateButton(); redraw(); };

  paintTabs(); paintInfo(); paintShare(); paintBody();
  dlgApi = openDialog({
    title: 'Export ' + KIND_LABEL[kind], wide: isGantt ? 'x' : true,
    body: h('div', null,
      h('p', { class: 'muted xo-lead', text: 'Choose who this is for. Each report keeps its own settings, and they are remembered the next time you export it.' }),
      tabs, info, shareBar,
      isGantt ? h('div', { class: 'xo' }, body, preview) : body),
    actions: [
      { label: 'Cancel' },
      {
        label: 'Download', primary: true,
        run: () => {
          if (!counts[active]) return false;
          const o = optsOf(active);
          if (!sharedXO(active)) saveXO(active, o); // with a project default, this device keeps nothing of its own
          saveDesc(active, o.desc || '');
          try { localStorage.setItem('schedsheet:xtype', active); } catch (e) { /* optional */ }
          toast('Preparing the ' + KIND_LABEL[kind] + '…');
          runExportJob(kind, [active], Os).catch(() => toast(kind === 'csv' ? 'Export failed.' : 'Could not load the export tools. Check your connection and try again.'));
        },
      },
    ],
  });
  updateButton();
  redraw();
}
function runExport(kind) {
  if (!S.work) return;
  if (!S.work.tasks.length) { toast('Add a task before exporting.'); return; }
  openExportDialog(kind);
}

/* ----- boot ----- */
async function boot() {
  setInterval(nagTick, 20000);
  bindStatic();
  renderAll();
  const c = window.claude;
  if (!c || !c.use) { S.noStore = true; renderAll(); return; }
  const [db, room, user, dl] = await Promise.all([c.use('db'), c.use('room'), c.use('user'), c.use('downloads')]);
  S.db = db; S.room = room; S.user = user; S.dl = dl;
  if (!db) { S.noStore = true; renderAll(); return; }
  if (user) {
    S.meId = await user.id();
    const cw = await user.can('data.write');
    S.readonly = cw === false;
  }
  db.collection('schedules').onSnapshot(onSchedSnap, (e) => fail('Could not load schedules', e));
  db.doc('config/holidays').onSnapshot(onHolSnap, (e) => fail('Could not load holidays', e));
  if (room) room.onPeers(onPeers, () => {});
  renderAll();
}
boot();
})();
